<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>酪農用飼料設計</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>酪農用飼料設計</h1>
    <form id="milk-form" method="post">
        <label for="milk_kg">目標乳量 (kg/日):</label>
        <input type="number" step="0.1" id="milk_kg" name="milk_kg" required>
        <button type="submit">設計</button>
    </form>
    <h2>飼料ライブラリ</h2>
    <table border="1">
        <tr>
            <th>飼料名</th><th>TDN(%)</th><th>CP(%)</th><th>NDF(%)</th>
        </tr>
        {% for name, comp in feeds.items() %}
        <tr>
            <td>{{ name }}</td>
            <td>{{ comp.TDN }}</td>
            <td>{{ comp.CP }}</td>
            <td>{{ comp.NDF }}</td>
        </tr>
        {% endfor %}
    </table>
    <div id="result"></div>
    <script src="/static/script.js"></script>
</body>
</html>
